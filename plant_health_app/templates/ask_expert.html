{% extends 'base.html' %}
{% block title %}Gửi câu hỏi{% endblock %}
{% block content %}
<div class="container mt-5" style="background-color: var(--background-color);">
    <h2 class="mb-4" style="color: var(--text-color);">Gửi câu hỏi đến chuyên gia</h2>
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }}" style="background-color: {% if message.tags == 'error' or message.tags == 'danger' %}var(--error-bg); color: var(--error-text){% elif message.tags == 'success' %}var(--success-bg); color: var(--success-text){% else %}var(--info-bg); color: var(--info-text){% endif %}; padding: 10px; border-radius: 4px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}
    <form method="post" enctype="multipart/form-data" id="question-form">
        {% csrf_token %}
        <div class="mb-3">
            <label for="question_text" class="form-label" style="color: var(--text-color);">Câu hỏi của bạn</label>
            <textarea class="form-control" id="question_text" name="question_text" rows="5" required style="background-color: var(--card-background); color: var(--text-color);"></textarea>
        </div>
        <div class="mb-3">
            <label for="plant_image_id" class="form-label" style="color: var(--text-color);">Hình ảnh cây trồng (tùy chọn)</label>
            <div class="d-flex align-items-center mb-2">
                <select class="form-select me-2" id="plant_image_id" name="plant_image_id" style="background-color: var(--card-background); color: var(--text-color);">
                    <option value="" data-url="">Không chọn hình ảnh</option>
                    {% for image in plant_images %}
                        <option value="{{ image.id }}" data-url="{{ image.image.url }}">Hình ảnh {{ image.uploaded_at|date:"d/m/Y H:i" }}</option>
                    {% endfor %}
                </select>
                <button type="button" class="btn" id="upload-image-btn" style="background-color: var(--primary-color); color: var(--text-light); padding: 10px; font-size: 0.85rem;"
                        onmouseover="this.style.backgroundColor='var(--custom-btn-hover)'"
                        onmouseout="this.style.backgroundColor='var(--primary-color)'"
                        aria-label="Tải ảnh lên">Tải ảnh</button>
            </div>
            <input type="file" id="plant-image-file" accept="image/*" style="display: none;">
            <div id="image-preview-container" class="mt-2" style="display: none;">
                <img id="image-preview" src="" alt="Xem trước hình ảnh" style="max-width: 200px; height: auto; border-radius: 4px; border: 1px solid #ddd;">
            </div>
            <div id="upload-error" class="alert alert-danger mt-2" style="display: none; background-color: var(--error-bg); color: var(--error-text);"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" style="color: var(--text-color);">Chế độ câu hỏi</label>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="is_public" id="public" value="public" checked>
                <label class="form-check-label" for="public" style="color: var(--text-color);">Công khai (tất cả chuyên gia có thể xem và trả lời)</label>
            </div>
            <div class="form-check">
                <input class="form-check-input" type="radio" name="is_public" id="private" value="private">
                <label class="form-check-label" for="private" style="color: var(--text-color);">Riêng tư (chỉ chuyên gia được chỉ định)</label>
            </div>
        </div>
        <div class="mb-3" id="expert_identifier_div" style="display: none;">
            <label for="expert_identifier" class="form-label" style="color: var(--text-color);">Tên người dùng hoặc email của chuyên gia</label>
            <input type="text" class="form-control" id="expert_identifier" name="expert_identifier" style="background-color: var(--card-background); color: var(--text-color);" placeholder="Nhập tên người dùng hoặc email">
        </div>
        <button type="submit" 
                class="btn" 
                style="background-color: var(--primary-color); color: var(--text-light); padding: 10px 15px; border-radius: 4px;"
                onmouseover="this.style.backgroundColor='var(--custom-btn-hover)'"
                onmouseout="this.style.backgroundColor='var(--primary-color)'"
                aria-label="Gửi câu hỏi">Gửi câu hỏi</button>
    </form>
</div>
<script>
    // Lấy CSRF token từ cookie
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Hiển thị/xóa bản xem trước hình ảnh khi chọn từ dropdown
    document.getElementById('plant_image_id').addEventListener('change', function() {
        const previewContainer = document.getElementById('image-preview-container');
        const previewImage = document.getElementById('image-preview');
        const selectedOption = this.options[this.selectedIndex];
        const imageUrl = selectedOption.getAttribute('data-url');
        
        if (imageUrl) {
            previewImage.src = imageUrl;
            previewContainer.style.display = 'block';
        } else {
            previewContainer.style.display = 'none';
            previewImage.src = '';
        }
    });

    // Kích hoạt input file khi nhấn nút "Tải ảnh lên"
    document.getElementById('upload-image-btn').addEventListener('click', function() {
        document.getElementById('plant-image-file').click();
    });

    // Xử lý tải ảnh lên qua AJAX
    document.getElementById('plant-image-file').addEventListener('change', function() {
        const file = this.files[0];
        const errorDiv = document.getElementById('upload-error');
        errorDiv.style.display = 'none';

        if (file) {
            console.log('Uploading file:', file.name, 'Size:', file.size, 'Type:', file.type);
            const formData = new FormData();
            formData.append('image', file);
            formData.append('csrfmiddlewaretoken', getCookie('csrftoken'));

            fetch('/upload-plant-image/', {
                method: 'POST',
                body: formData,
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            })
            .then(response => {
                console.log('Response status:', response.status);
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                console.log('Server response:', data);
                if (data.success) {
                    const select = document.getElementById('plant_image_id');
                    const option = new Option(`Hình ảnh ${data.uploaded_at}`, data.id);
                    option.setAttribute('data-url', data.image_url);
                    select.appendChild(option);
                    select.value = data.id;

                    // Hiển thị bản xem trước
                    const previewContainer = document.getElementById('image-preview-container');
                    const previewImage = document.getElementById('image-preview');
                    previewImage.src = data.image_url;
                    previewContainer.style.display = 'block';
                } else {
                    errorDiv.textContent = data.error || 'Lỗi khi tải ảnh lên.';
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Upload error:', error);
                errorDiv.textContent = 'Lỗi khi tải ảnh: ' + error.message;
                errorDiv.style.display = 'block';
            });
        }
    });

    // Hiển thị/ẩn trường chuyên gia khi chọn chế độ câu hỏi
    document.querySelectorAll('input[name="is_public"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.getElementById('expert_identifier_div').style.display = this.value === 'private' ? 'block' : 'none';
        });
    });
</script>
{% endblock %}
